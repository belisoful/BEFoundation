name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin the toolchain so an image bump cannot silently change the default Xcode.
# The macos-15 image ships several Xcodes (16.0–16.4 and 26.x) plus a mix of
# iOS Simulator runtimes; this keeps every job on the same compiler and SDK.
env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build-and-test:
    name: Build, Test, and Validate Docs (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build framework
        run: |
          set -o pipefail
          xcodebuild -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     test

      # Warnings are not errors here: Xcode 16.4's DocC reports a false
      # "Parameter is missing documentation" for +[BEWebData dataWithContentsOfURL:options:error:].
      # The Xcode 27 job enforces --warnings-as-errors.
      - name: Validate documentation catalog
        run: |
          set -o pipefail
          xcodebuild docbuild -project BEFoundation.xcodeproj \
                              -scheme BEFoundation \
                              -configuration Debug \
                              -destination 'platform=macOS' \
                              CODE_SIGNING_ALLOWED=NO

  ios-test:
    name: Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unit tests (iOS)
        run: |
          set -o pipefail
          # Resolve a concrete simulator from simctl, matched to the pinned Xcode:
          #   * iOS major from the selected Xcode's SDK — the pinned Xcode 16.4
          #     ships the iOS 18 SDK and cannot boot the iOS 26.x runtimes the
          #     image also carries. Deriving the major keeps this correct if the
          #     DEVELOPER_DIR pin is later moved to a different Xcode.
          #   * iPad — the targets build for iPhone and iPad; an iPad simulator is
          #     always present on the runner, so it is a dependable choice.
          # A concrete id is required by the `test` action and keeps the build on the
          # active arm64 arch (the runner is Apple Silicon), so the x86_64 simulator
          # slice is not built. `xcodebuild -showdestinations` is not used: it returns
          # only placeholders on the runner. `|| true` stops an empty match from
          # aborting the step (bash runs with -e) before the diagnostics print.
          SDK_MAJOR=$(xcodebuild -showsdks 2>/dev/null \
                        | grep -oiE 'iphonesimulator[0-9]+' | grep -oE '[0-9]+' \
                        | sort -n | tail -1 || true)
          echo "Xcode iOS Simulator SDK major: ${SDK_MAJOR:-unknown}"
          if [ -z "$SDK_MAJOR" ]; then
            echo "No iOS Simulator SDK under DEVELOPER_DIR=$DEVELOPER_DIR"
            xcodebuild -version
            exit 1
          fi
          ID=$(xcrun simctl list devices available \
                 | awk -v hdr="-- iOS ${SDK_MAJOR}" 'index($0,hdr)==1{f=1;next} /^-- /{f=0} f && /iPad/' \
                 | grep -oiE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
                 | head -1 || true)
          if [ -z "$ID" ]; then
            echo "No iPad iOS ${SDK_MAJOR} simulator available. Runtimes and devices:"
            xcrun simctl list runtimes
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $ID"
          xcrun simctl boot "$ID" 2>/dev/null || true
          xcodebuild test \
                     -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination "platform=iOS Simulator,id=$ID" \
                     CODE_SIGNING_ALLOWED=NO

  x86-test:
    name: Tests (macOS x86_64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rosetta
        # macos-15 runners are Apple Silicon; the x86_64 test bundle runs under Rosetta.
        # The image usually ships it already; install only when the x86_64 probe fails.
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Run unit tests (x86_64)
        run: |
          set -o pipefail
          xcodebuild test \
                     -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination 'platform=macOS,arch=x86_64' \
                     CODE_SIGNING_ALLOWED=NO

  address-sanitizer:
    name: Tests under AddressSanitizer
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unit tests with ASan
        run: |
          set -o pipefail
          xcodebuild -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     -enableAddressSanitizer YES \
                     CODE_SIGNING_ALLOWED=NO \
                     test

  release-toolchain:
    name: Build and Test (release Xcode)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Releases are built with the newest Xcode 26 (see AGENTS.md "Release Packaging"),
      # while the jobs above pin Xcode 16.4. This job compiles and tests with the newest
      # Xcode 26 on the image so a release-only regression surfaces before packaging.
      - name: Select the newest Xcode 26
        run: |
          set -o pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 on this image:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "RELEASE_DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Run unit tests
        # A step-level env overrides the workflow-level DEVELOPER_DIR pin.
        env:
          DEVELOPER_DIR: ${{ env.RELEASE_DEVELOPER_DIR }}
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     test

  xcode-27:
    name: Build and Test (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The newest toolchain. Xcode 27 raised the lowest accepted deployment targets to
      # macOS 12 / iOS 15, which the project declares, so this job runs without overrides.
      - name: Select the newest Xcode 27
        run: |
          set -o pipefail
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 27 on this image:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "XCODE27_DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Run unit tests
        env:
          DEVELOPER_DIR: ${{ env.XCODE27_DEVELOPER_DIR }}
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     test

      - name: Validate documentation catalog
        env:
          DEVELOPER_DIR: ${{ env.XCODE27_DEVELOPER_DIR }}
        run: |
          set -o pipefail
          xcodebuild docbuild -project BEFoundation.xcodeproj \
                              -scheme BEFoundation \
                              -configuration Debug \
                              -destination 'platform=macOS' \
                              CODE_SIGNING_ALLOWED=NO \
                              OTHER_DOCC_FLAGS="--warnings-as-errors"

  static-analyzer:
    name: Static analyzer
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The three nullability findings in the vendored NSMutableNumber.mm are known
      # false positives (see FIXES.md); any other analyzer warning fails the job.
      - name: Analyze the framework
        run: |
          set -o pipefail
          xcodebuild analyze -project BEFoundation.xcodeproj \
                             -scheme BEFoundation \
                             -configuration Debug \
                             -destination 'platform=macOS' \
                             CODE_SIGNING_ALLOWED=NO \
            | tee analyze.log
          FINDINGS=$(grep -E '^/.*: warning: ' analyze.log | grep -v 'NSMutableNumber.mm' | sort -u || true)
          if [ -n "$FINDINGS" ]; then
            echo "Unexpected analyzer findings:"
            echo "$FINDINGS"
            exit 1
          fi

  pod-lint:
    name: CocoaPods lint
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Guards the podspec (source globs, license, platforms) the way swiftpm-build
      # guards Package.swift. Static builds a local library only, without a demo app.
      - name: Lint the podspec
        run: |
          set -o pipefail
          pod lib lint BEFoundation.podspec --allow-warnings --skip-tests

  swiftpm-build:
    name: SwiftPM build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift version
        run: swift --version

      # Guards the package manifest and the include/BEFoundation layout that
      # `#import <BEFoundation/…>` depends on. The XCTest suite runs through
      # xcodebuild in the other jobs; SwiftPM builds the library only.
      - name: Build the SwiftPM package
        run: |
          set -o pipefail
          swift build

  category-collisions:
    name: Category selector collisions
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A category method whose selector already exists on the Apple class resolves in
      # undefined load order. It presents as a flaky test rather than a build failure, so
      # nothing else in this workflow would catch it. See CATEGORY_NAMING.md.
      - name: Build framework (Release)
        run: |
          set -o pipefail
          xcodebuild -project BEFoundation.xcodeproj \
                     -scheme BEFoundation \
                     -configuration Release \
                     -destination 'platform=macOS' \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CLANG_USE_OPTIMIZATION_PROFILE=NO \
                     CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/collision-check" \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Check for collisions with Apple selectors
        run: |
          set -o pipefail
          Scripts/check-category-collisions.sh "$RUNNER_TEMP/collision-check/BEFoundation.framework"
